<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxe Escape Concierge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">LUXE ESCAPE CONCIERGE</p>
    <h1>Plan Your Escape ✈️</h1>
    <p class="intro">Build a dream trip, save it, refresh the page, and see what your browser remembers.</p>

    <section class="planner">
      <label for="name">Traveler Name</label>
      <input id="name" type="text" placeholder="Amanda">

      <label for="destination">Dream Destination</label>
      <input id="destination" type="text" placeholder="Maldives">

      <label for="vibe">Travel Vibe</label>
      <select id="vibe">
        <option value="Luxury">Luxury 🥂</option>
        <option value="Adventure">Adventure 🧗</option>
        <option value="Relaxing">Relaxing 🌴</option>
        <option value="Nightlife">Nightlife 🌙</option>
      </select>

      <label for="budget">Budget</label>
      <select id="budget">
        <option value="1500">$1,500</option>
        <option value="3000">$3,000</option>
        <option value="5000">$5,000</option>
        <option value="10000">$10,000+</option>
      </select>

      <label for="mustHave">Trip Must-Have</label>
      <input id="mustHave" type="text" placeholder="Ocean view">

      <div class="buttons">
        <button id="saveBtn">SAVE MY ESCAPE</button>
        <button id="forgetBtn" class="secondary">FORGET MY TRIP</button>
      </div>
    </section>

    <section class="passport">
      <p class="eyebrow">YOUR SAVED ESCAPE</p>
      <h2 id="welcome">No trip saved yet.</h2>
      <div class="trip-grid">
        <p><strong>Destination:</strong> <span id="savedDestination">—</span></p>
        <p><strong>Vibe:</strong> <span id="savedVibe">—</span></p>
        <p><strong>Budget:</strong> $<span id="savedBudget">—</span></p>
        <p><strong>Must-Have:</strong> <span id="savedMustHave">—</span></p>
      </div>
      <p id="tripCount" class="count"></p>
    </section>

    <p class="hint">Save your trip → refresh → inspect Local Storage in DevTools.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
